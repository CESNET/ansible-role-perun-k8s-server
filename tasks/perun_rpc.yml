# generate YAML objects
- name: "generate YAML files in {{ chart_path}} }}/templates/ directory"
  loop:
    - perun-rpc-secret-etc-perun.yaml
    - perun-rpc-secret-home-perun.yaml
    - perun-rpc-persistent-volume-claim-logs.yaml
    - perun-rpc-deployment.yaml
  ansible.builtin.template:
    src: "templates/charts/{{ chart_name }}/{{ item }}.j2"
    dest: "{{ chart_path }}/templates/{{ item }}"

- name: "apply chart"
  kubernetes.core.helm:
    chart_ref: "{{ chart_path }}"
    release_namespace: "{{ k8s_namespace }}"
    context: "{{ k8s_context }}"
    release_name: perun-rpc
    release_state: present

- name: "debug info"
  when: perun_rpc_k8s_debug
  block:
    - name: "get pod info"
      kubernetes.core.k8s_info:
          kind: Pod
          namespace: "{{ k8s_namespace }}"
          context: "{{ k8s_context }}"
          label_selectors:
          - app=perun-rpc
      register: perunrpc_pod_info
    - name: "command for shell"
      debug:
        msg: "kubectl exec -it {{ perunrpc_pod_info.resources[0].metadata.name }} --container {{ perunrpc_pod_info.resources[0].spec.containers[0].name }} -- /bin/bash"